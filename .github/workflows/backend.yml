name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v

  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            codeykenny/backend-repo:latest
            codeykenny/backend-repo:${{ github.sha }}
            codeykenny/backend-repo:${{ github.run_number }}

  deploy:
    name: Deploy Backend
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Pull latest Docker images
        run: docker compose pull

      - name: Deploy with Docker Compose
        run: docker compose up -d

      - name: Verify deployment
        run: |
          docker compose ps

          echo "Waiting for backend API..."

          for i in {1..30}; do
            if curl -fs http://localhost:5000/api/users; then
              echo
              echo "Backend API is ready!"
              break
            fi

            echo "API not ready yet. Waiting 2 seconds..."
            sleep 2
          done

          echo "Final API check:"
          curl -f http://localhost:5000/api/users

